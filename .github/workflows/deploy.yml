name: Build and Deploy BrighterTube

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies and Ropm
        run: |
          npm install
          npm install -g ropm
          ropm install

      - name: Commit Ropm Files Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Safely stage package.json or any modified dependency layout
          for file in package.json package-lock.json; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done
          
          # Check if there are any staged changes to commit
          if git diff --staged --quiet; then
            echo "No package changes to commit."
          else
            git commit -m "chore: auto-update ropm dependencies [skip ci]"
            git push
            echo "Successfully committed dependency updates back to repository."
          fi

      - name: Compile BrighterScript
        run: |
          npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sideload to Roku Device
        run: |
          curl --digest -u "rokudev:${{ secrets.ROKU_DEV_PASSWORD }}" \
            -F "mysubmit=Install" \
            -F "archive=@./out/brighter-tube.zip" \
            http://192.168.1.231/plugin_install

      - name: Stream Roku Logs
        run: |
          sudo apt-get update && sudo apt-get install -y telnet
          timeout 5 telnet 192.168.1.231 8080 || true
