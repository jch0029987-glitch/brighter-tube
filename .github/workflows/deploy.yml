name: Build and Deploy BrighterTube

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile BrighterScript
        run: |
          npm install
          npm run build

      - name: Debug Directory Contents
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== Checking potential output dirs ==="
          ls -la dist/ || true
          ls -la out/ || true

      - name: Package App Zip
        run: |
          # Fallback or dynamic packaging depending on where bsc outputs
          if [ -d "dist" ]; then
            cd dist && zip -r brighter-tube.zip .
          elif [ -d "out" ]; then
            cd out && zip -r ../brighter-tube.zip .
          else
            # If bsc outputs directly to root or somewhere else
            zip -r brighter-tube.zip manifest source components
          fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sideload to Roku Device
        run: |
          curl --digest -u "rokudev:${{ secrets.ROKU_DEV_PASSWORD }}" \
            -F "mysubmit=Install" \
            -F "archive=@./brighter-tube.zip" \
            http://192.168.1.231/plugin_install

      - name: Stream Roku Logs
        run: |
          sudo apt-get update && sudo apt-get install -y telnet
          timeout 5 telnet 192.168.1.231 8080 || true
